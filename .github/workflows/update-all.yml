name: Auto Update Winget Packages

on:
  schedule:
    - cron: '0,30 * * * *' 
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - id: set-matrix
        run: |
          JSON=$(cat packages.json | jq -c .)
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT

  update-packages:
    needs: prepare-matrix
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    name: Update ${{ matrix.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Create results dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path results
        
      - name: Process ${{ matrix.id }}
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          ./.github/scripts/update-package.ps1 `
            -PackageId "${{ matrix.id }}" `
            -Type "${{ matrix.type || 'github' }}" `
            -TargetRepo "${{ matrix.repo }}" `
            -AssetRegex "${{ matrix.assetRegex }}" `
            -Urls "${{ matrix.urls }}" `
            -ReleaseNotesUrl "${{ matrix.releaseNotesUrl }}" `
            -VersionRegex "${{ matrix.versionRegex }}"
            
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.id }}
          # 💡 核心修复：只上传当前包生成的这一个文件，绝不夹带旧文件
          path: results/${{ matrix.id }}.json

  update-readme:
    needs: update-packages
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          # 💡 既然上传的只有单个文件，直接平铺下载到 results/ 目录即可，不需要中间临时目录
          path: results
          merge-multiple: true
          
      - name: Update Bilingual READMEs
        shell: pwsh
        run: |
          # 现在读取 results 下的所有 JSON，直接就能拿到最新数据
          $results = Get-ChildItem -Path "results/*.json" | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json }
          
          $tableEn = "| Package | Version | Status | PR Link |`n| --- | --- | --- | --- |`n"
          $tableZh = "| 软件包 | 版本 | 状态 | PR 链接 |`n| --- | --- | --- | --- |`n"
          
          foreach ($r in $results) {
              $linkEn = if ($r.PRLink) { "[View PR]($($r.PRLink))" } else { "-" }
              $linkZh = if ($r.PRLink) { "[查看 PR]($($r.PRLink))" } else { "-" }
              
              $statusEn = switch ($r.Status) {
                  "✅ 已是最新" { "✅ Up to date" }
                  "⏳ PR 等待审核" { "⏳ PR Pending" }
                  "🚀 已自动提交 PR" { "🚀 PR Submitted" }
                  "⚠️ PR 提交可能失败" { "⚠️ Submission Failed" }
                  default { $r.Status }
              }
              
              $tableEn += "| $($r.PackageId) | $($r.Version) | $statusEn | $linkEn |`n"
              $tableZh += "| $($r.PackageId) | $($r.Version) | $($r.Status) | $linkZh |`n"
          }
          
          $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss (UTC)"
          
          if (Test-Path "README.md") {
              $readmeEn = Get-Content README.md -Raw
              $readmeEn = $readmeEn -replace '(?<=<!-- TIMESTAMP_START -->).*(?=<!-- TIMESTAMP_END -->)', $time
              $readmeEn = $readmeEn -replace '(?s)(?<=<!-- TABLE_START -->).*(?=<!-- TABLE_END -->)', "`n$tableEn`n"
              Set-Content README.md -Value $readmeEn -Encoding utf8
          }
          
          if (Test-Path "README_ZH.md") {
              $readmeZh = Get-Content README_ZH.md -Raw
              $readmeZh = $readmeZh -replace '(?<=<!-- TIMESTAMP_START -->).*(?=<!-- TIMESTAMP_END -->)', $time
              $readmeZh = $readmeZh -replace '(?s)(?<=<!-- TABLE_START -->).*(?=<!-- TABLE_END -->)', "`n$tableZh`n"
              Set-Content README_ZH.md -Value $readmeZh -Encoding utf8
          }

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_ZH.md results/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update status [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit"
          fi
